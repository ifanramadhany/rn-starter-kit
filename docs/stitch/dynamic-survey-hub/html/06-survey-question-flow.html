<script>
        // Micro-interactions for option selection
        const options = document.querySelectorAll('input[name="satisfaction"]');
        options.forEach(option => {
            option.addEventListener('change', (e) => {
                // Remove active classes from all parents
                document.querySelectorAll('#options-container label').forEach(label => {
                    label.classList.remove('bg-primary/5', 'border-primary');
                });
                
                // Add active classes to the selected parent
                if (e.target.checked) {
                    e.target.closest('label').classList.add('bg-primary/5', 'border-primary');
                }
            });
        });

        // Simple button interaction
        const nextBtn = document.querySelector('button.bg-primary');
        nextBtn.addEventListener('click', () => {
            nextBtn.classList.add('scale-95');
            setTimeout(() => nextBtn.classList.remove('scale-95'), 150);
        });
    </script>
