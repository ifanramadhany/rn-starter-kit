<script>
        // Simple micro-interaction for confetti effect on load
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-anchor');
            const colors = ['#006a6a', '#003c90', '#90efef', '#3f5c69'];
            
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.opacity = '0';
                confetti.style.transform = `scale(${Math.random()})`;
                
                container.appendChild(confetti);
                
                // Animation
                confetti.animate([
                    { transform: `translate(0, 0) rotate(0deg) scale(0)`, opacity: 0 },
                    { opacity: 0.8, offset: 0.1 },
                    { transform: `translate(${(Math.random() - 0.5) * 400}px, ${(Math.random() - 0.5) * 400}px) rotate(${Math.random() * 360}deg) scale(1)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                    delay: Math.random() * 200
                });
            }
        });

        // Hover sounds or additional micro-interactions could go here
